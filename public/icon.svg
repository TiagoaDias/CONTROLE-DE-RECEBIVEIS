<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Pristine clean modern white with subtle luxury depth -->
    <linearGradient id="iconBgGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Subtle elegant inner squircle border for depth on white wallpapers -->
    <linearGradient id="iconBorderGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Soft ambient glow under the 3D logo -->
    <radialGradient id="centerGlowWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the 3D logo on white background -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>

    <!-- Official Haspaho Facet Gradients (Optimized for ultra-vivid pop on white) -->
    <linearGradient id="blueDarkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3258" />
      <stop offset="100%" stop-color="#071b30" />
    </linearGradient>

    <linearGradient id="blueLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e6db0" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Glowing emerald green ribbon gradient -->
    <linearGradient id="greenRibbonGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="greenHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Clean, high-contrast White Squircle base -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#iconBgGradWhite)" stroke="url(#iconBorderGradWhite)" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlowWhite)"/>

  <!-- Centered, EXTRA LARGE Official HASPAHO 3D Symbol with shadow for maximum mobile punch -->
  <g transform="translate(68, 44) scale(3.14)" filter="url(#logoShadow)">
    <!-- Ambient back shadow under symbol -->
    <path d="M22,25 L44,8 L52,15 L98,25 L98,88 L76,105 L68,112 L44,105 L22,88 Z" fill="#0f172a" opacity="0.18" transform="translate(0, 5)"/>

    <!-- Left Pillar - Facet A (Back/Base) -->
    <polygon points="22,25 44,8 44,105 22,88" fill="url(#blueDarkFacet)"/>

    <!-- Left Pillar - Facet B (Front 3D chamfer) -->
    <polygon points="44,8 52,15 52,112 44,105" fill="url(#blueLightFacet)"/>

    <!-- Left Tech Circuit Lines -->
    <path d="M26,38 L38,48 L38,75 M30,55 L38,62 M28,80 L36,87" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-opacity="0.95"/>
    <circle cx="26" cy="38" r="2.5" fill="#5eead4" />
    <circle cx="30" cy="55" r="2.2" fill="#5eead4" />
    <circle cx="28" cy="80" r="2.2" fill="#5eead4" />

    <!-- Right Pillar - Facet A (Front chamfer) -->
    <polygon points="68,15 76,8 76,105 68,112" fill="url(#blueLightFacet)"/>

    <!-- Right Pillar - Facet B (Main side face) -->
    <polygon points="76,8 98,25 98,88 76,105" fill="url(#cyanFacet)"/>

    <!-- Right Tech Circuit Lines -->
    <path d="M94,40 L82,50 L82,82 M90,62 L82,69 M92,82 L84,89" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.95"/>
    <circle cx="94" cy="40" r="2.5" fill="#7dd3fc" />
    <circle cx="90" cy="62" r="2.2" fill="#7dd3fc" />
    <circle cx="92" cy="82" r="2.2" fill="#7dd3fc" />

    <!-- Central Vertical Connector Core -->
    <polygon points="44,52 76,52 76,70 44,70" fill="#0f172a" opacity="0.95"/>

    <!-- Dynamic Curved Emerald Green Ribbon Swoosh -->
    <!-- Layer 1: Under shadow for ribbon -->
    <path d="M20,95 C36,92 48,76 60,63 C72,50 86,36 102,28 C100,38 90,52 78,65 C64,80 48,97 20,95 Z" fill="#064e3b" opacity="0.45"/>

    <!-- Layer 2: Main Emerald Wave -->
    <path d="M22,92 C38,88 50,72 61,59 C72,46 86,32 100,24 C100,33 90,46 79,60 C66,76 50,94 22,92 Z" fill="url(#greenRibbonGrad)"/>

    <!-- Layer 3: Dynamic Top Highlight curve -->
    <path d="M26,88 C40,84 52,68 62,56 C74,42 88,29 98,25 C92,30 80,44 70,58 C58,74 44,87 26,88 Z" fill="url(#greenHighlightGrad)" opacity="0.98"/>

    <!-- Sparkle/Glow Star Accent on Crest -->
    <g transform="translate(98, 24)">
      <circle cx="0" cy="0" r="3" fill="#ffffff" filter="drop-shadow(0 0 3px #38bdf8)"/>
      <path d="M-6,0 L6,0 M0,-6 L0,6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Sparkle Accent on Ribbon Bow -->
    <g transform="translate(24, 91)">
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="drop-shadow(0 0 3px #34d399)"/>
    </g>
  </g>
</svg>