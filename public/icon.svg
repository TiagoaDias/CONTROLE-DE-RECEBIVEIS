<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="16"/>
  <!-- H letter combined with financial graph bars -->
  <g transform="translate(116, 116) scale(11.6)">
    <!-- Left vertical of H -->
    <rect x="4" y="4" width="6" height="24" rx="3" fill="url(#blueGrad)"/>
    <!-- Right vertical of H -->
    <rect x="22" y="4" width="6" height="24" rx="3" fill="url(#blueGrad)"/>
    <!-- Crossbar of H with upward trend arrow -->
    <path d="M10 16 L18 10 L22 14" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="14" r="2.5" fill="#fbbf24"/>
  </g>
</svg>
