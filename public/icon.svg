<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep luxury navy & dark slate -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b33"/>
      <stop offset="45%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#020b17"/>
    </linearGradient>

    <!-- App Icon squircle border highlight -->
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle radial background glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Official Haspaho Facet Gradients -->
    <linearGradient id="blueDarkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b49" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <linearGradient id="blueLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c91" />
      <stop offset="50%" stop-color="#0a7ea4" />
      <stop offset="100%" stop-color="#0b3d66" />
    </linearGradient>

    <linearGradient id="blueRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4370" />
      <stop offset="100%" stop-color="#061b30" />
    </linearGradient>

    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a0c8" />
      <stop offset="100%" stop-color="#0d527a" />
    </linearGradient>

    <!-- Glowing emerald green ribbon gradient -->
    <linearGradient id="greenRibbonGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#006644" />
      <stop offset="35%" stop-color="#00a86b" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="greenHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with high-end luxury finish -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#iconBgGrad)" stroke="url(#iconBorderGrad)" stroke-width="6"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#centerGlow)"/>

  <!-- Centered Official HASPAHO 3D Symbol -->
  <g transform="translate(97, 77) scale(2.65)" filter="url(#iconShadow)">
    <!-- Left Pillar - Facet A (Back/Base) -->
    <polygon points="22,25 44,8 44,105 22,88" fill="url(#blueDarkFacet)"/>

    <!-- Left Pillar - Facet B (Front 3D chamfer) -->
    <polygon points="44,8 52,15 52,112 44,105" fill="url(#blueLightFacet)"/>

    <!-- Left Tech Circuit Lines -->
    <path d="M26,38 L38,48 L38,75 M30,55 L38,62 M28,80 L36,87" stroke="#14b8a6" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="26" cy="38" r="2.2" fill="#2dd4bf" />
    <circle cx="30" cy="55" r="1.8" fill="#2dd4bf" />
    <circle cx="28" cy="80" r="1.8" fill="#2dd4bf" />

    <!-- Right Pillar - Facet A (Front chamfer) -->
    <polygon points="68,15 76,8 76,105 68,112" fill="url(#blueLightFacet)"/>

    <!-- Right Pillar - Facet B (Main side face) -->
    <polygon points="76,8 98,25 98,88 76,105" fill="url(#cyanFacet)"/>

    <!-- Right Tech Circuit Lines -->
    <path d="M94,40 L82,50 L82,82 M90,62 L82,69 M92,82 L84,89" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="94" cy="40" r="2.2" fill="#7dd3fc" />
    <circle cx="90" cy="62" r="1.8" fill="#7dd3fc" />
    <circle cx="92" cy="82" r="1.8" fill="#7dd3fc" />

    <!-- Central Vertical Connector Core -->
    <polygon points="44,52 76,52 76,70 44,70" fill="#061b30" opacity="0.95"/>

    <!-- Dynamic Curved Emerald Green Ribbon Swoosh -->
    <!-- Layer 1: Under shadow for ribbon -->
    <path d="M20,95 C36,92 48,76 60,63 C72,50 86,36 102,28 C100,38 90,52 78,65 C64,80 48,97 20,95 Z" fill="#034d35" opacity="0.6"/>

    <!-- Layer 2: Main Emerald Wave -->
    <path d="M22,92 C38,88 50,72 61,59 C72,46 86,32 100,24 C100,33 90,46 79,60 C66,76 50,94 22,92 Z" fill="url(#greenRibbonGrad)"/>

    <!-- Layer 3: Dynamic Top Highlight curve -->
    <path d="M26,88 C40,84 52,68 62,56 C74,42 88,29 98,25 C92,30 80,44 70,58 C58,74 44,87 26,88 Z" fill="url(#greenHighlightGrad)" opacity="0.95"/>

    <!-- Inner Light Glow Spark -->
    <ellipse cx="61" cy="58" rx="3.5" ry="1.5" transform="rotate(-35 61 58)" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
