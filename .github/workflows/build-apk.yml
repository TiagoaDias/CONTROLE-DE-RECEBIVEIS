name: Gerar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Compilar aplicação web
        run: npm run build:client

      - name: Sincronizar arquivos web para o Android
        run: |
          rm -rf android/app/src/main/assets/public/*
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          chmod +x android/gradlew

      - name: Aceitar licencas do Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b1d79a304379883533763dd7f527df\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479edd1809707b99a53e8ec6b257b146\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Gerar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Recebiveis-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Release com APK Direto
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v90.0
          name: "Atualização 90 PRO - Seletor de Contas Google"
          body: "Atualização 90 oficial com Seletor de Contas Google interativo para Android, troca limpa de usuários e correção de persistência."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
